<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Dashboard</title>
<meta name="description" content="Browser-only dashboard for Claude Code token usage. Your logs are read locally and never uploaded.">
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f4f1;
  --surface-1: #fcfcfb;
  --border: #e2e1dc;
  --grid: #ecebe7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #77766f;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --accent: #2a78d6;
  --warn-bg: #fff4dc;
  --warn-text: #6b4a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #2e2e2c;
    --grid: #272725;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e85;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --accent: #3987e5;
    --warn-bg: #2d2410;
    --warn-text: #e9c97a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --border: #2e2e2c;
  --grid: #272725;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e85;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --accent: #3987e5;
  --warn-bg: #2d2410;
  --warn-text: #e9c97a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--surface-0);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
header.top {
  display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center;
  padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface-1);
}
header.top h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .01em; }
header.top .spacer { flex: 1; }
.nowrap { white-space: nowrap; }
.btn, select {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.btn:hover, select:hover { border-color: var(--text-muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.tabs { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; background: var(--surface-1); border-bottom: 1px solid var(--border); }
nav.tabs a {
  padding: 8px 14px; text-decoration: none; color: var(--text-secondary);
  border-bottom: 2px solid transparent; white-space: nowrap;
}
nav.tabs a[aria-current="page"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
.status { color: var(--text-secondary); font-size: 13px; padding: 8px 16px; }
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin-bottom: 16px;
}
.card h2 { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
.card .sub { color: var(--text-muted); font-size: 12px; margin: 0 0 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .label { color: var(--text-secondary); font-size: 12px; }
.kpi .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .note { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid2 .card { margin-bottom: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 8px; padding: 0; list-style: none; color: var(--text-secondary); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 2px 4px; }
svg text { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .seg { stroke: var(--surface-1); stroke-width: 2; }
.hbars { list-style: none; margin: 0; padding: 0; }
.hbars li { display: grid; grid-template-columns: minmax(80px, 38%) 1fr auto; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
.hbars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
.hbars .track { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.hbars .fill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
.hbars .val { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-0); }
.tablewrap { overflow-x: auto; }
.muted { color: var(--text-muted); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
details.prompt { border-top: 1px solid var(--border); padding: 10px 0; }
details.prompt:first-of-type { border-top: 0; }
details.prompt summary { cursor: pointer; display: grid; grid-template-columns: 28px 1fr auto auto; gap: 12px; align-items: baseline; list-style: none; }
details.prompt summary::-webkit-details-marker { display: none; }
details.prompt .rank { color: var(--text-muted); font-variant-numeric: tabular-nums; }
details.prompt .ptext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.prompt .body { margin: 10px 0 0 40px; }
pre.ptxt { white-space: pre-wrap; word-break: break-word; background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 0 0 10px; max-height: 220px; overflow: auto; font-size: 12px; }
.tip { border-left: 3px solid var(--series-4); }
.tip .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.tip h3 { margin: 2px 0 4px; font-size: 14px; word-break: break-word; }
.tip p { margin: 0 0 8px; color: var(--text-secondary); }
.empty {
  border: 2px dashed var(--border); border-radius: 16px; padding: 40px 20px; text-align: center;
  background: var(--surface-1);
}
.empty.drag { border-color: var(--accent); }
.empty h2 { margin: 0 0 8px; font-size: 20px; }
.empty p { max-width: 560px; margin: 8px auto; color: var(--text-secondary); }
.empty .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
.empty ol { text-align: left; max-width: 560px; margin: 16px auto 0; color: var(--text-secondary); }
.notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; }
#tip-box {
  position: fixed; z-index: 10; pointer-events: none; display: none; min-width: 150px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
}
#tip-box .t { font-weight: 650; margin-bottom: 4px; }
#tip-box .r { display: flex; justify-content: space-between; gap: 16px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
#tip-box .r i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.back { display: inline-block; margin-bottom: 12px; }
@media (max-width: 560px) {
  details.prompt summary { grid-template-columns: 24px 1fr auto; }
  details.prompt summary .tok { display: none; }
  details.prompt .body { margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Token Dashboard</h1>
  <button class="btn primary" id="btn-live" type="button" hidden>Connect folder (auto-refresh)</button>
  <button class="btn" id="btn-unlive" type="button" hidden>Stop live</button>
  <span id="live-controls" hidden>
    <span class="nowrap"><label class="muted" for="poll">Refresh</label>
    <select id="poll" aria-label="Auto-refresh interval"></select></span>
    <button class="btn" id="btn-scan" type="button">Scan now</button>
  </span>
  <button class="btn primary" id="btn-folder" type="button">Choose projects folder</button>
  <button class="btn" id="btn-files" type="button">Choose .jsonl files</button>
  <button class="btn" id="btn-sample" type="button">Sample data</button>
  <span class="spacer"></span>
  <span class="nowrap"><label class="muted" for="plan">Plan</label>
  <select id="plan" aria-label="Pricing plan"></select></span>
  <button class="btn" id="btn-theme" type="button" aria-label="Toggle light or dark theme">Theme</button>
  <input type="file" id="in-folder" webkitdirectory directory multiple hidden>
  <input type="file" id="in-files" accept=".jsonl" multiple hidden>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="status" id="status" role="status" aria-live="polite"></div>
<main id="view"></main>
<div id="tip-box" role="tooltip"></div>

<script>
"use strict";
/* ───────── config (mirrors pricing.json in the repo; USD per 1M tokens) ───────── */
const PRICING = {
  models: {
    "claude-opus-4-7":   { tier: "opus",   input: 15, output: 75, cache_read: 1.5, cache_create_5m: 18.75, cache_create_1h: 30 },
    "claude-opus-4-6":   { tier: "opus",   input: 15, output: 75, cache_read: 1.5, cache_create_5m: 18.75, cache_create_1h: 30 },
    "claude-sonnet-4-6": { tier: "sonnet", input: 3,  output: 15, cache_read: 0.3, cache_create_5m: 3.75,  cache_create_1h: 6 },
    "claude-haiku-4-5":  { tier: "haiku",  input: 1,  output: 5,  cache_read: 0.1, cache_create_5m: 1.25,  cache_create_1h: 2 }
  },
  tier_fallback: {
    opus:   { input: 15, output: 75, cache_read: 1.5, cache_create_5m: 18.75, cache_create_1h: 30 },
    sonnet: { input: 3,  output: 15, cache_read: 0.3, cache_create_5m: 3.75,  cache_create_1h: 6 },
    haiku:  { input: 1,  output: 5,  cache_read: 0.1, cache_create_5m: 1.25,  cache_create_1h: 2 }
  },
  plans: {
    "api":     { monthly: 0,   label: "API (pay-per-token)" },
    "pro":     { monthly: 20,  label: "Pro" },
    "max":     { monthly: 100, label: "Max" },
    "max-20x": { monthly: 200, label: "Max 20x" }
  }
};
const TARGET_FIELDS = { Read: "file_path", Edit: "file_path", Write: "file_path", Glob: "pattern", Grep: "pattern",
  Bash: "command", WebFetch: "url", WebSearch: "query", Task: "subagent_type", Skill: "skill" };
const DAY = 86400000;

/* ───────── small helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("en-US");
const fmtInt = n => nf.format(Math.round(n));
function fmtTok(n) {
  n = n || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1) + "k";
  return fmtInt(n);
}
const fmtUsd = n => "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = x => (x * 100).toFixed(0) + "%";
const fmtDate = ts => ts ? ts.replace("T", " ").slice(0, 16) + " UTC" : "";
const trunc = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked: ignore */ } }

/* ───────── pricing ───────── */
function tierOf(model) {
  const m = (model || "").toLowerCase();
  for (const t of ["opus", "sonnet", "haiku"]) if (m.includes(t)) return t;
  return null;
}
function costOf(model, u) {
  let r = PRICING.models[model], estimated = false;
  if (!r) {
    const t = tierOf(model);
    if (!t) return { usd: null, estimated: true };
    r = PRICING.tier_fallback[t]; estimated = true;
  }
  const usd = (u.i * r.input + u.o * r.output + u.cr * r.cache_read + u.c5 * r.cache_create_5m + u.c1 * r.cache_create_1h) / 1e6;
  return { usd, estimated };
}

/* ───────── parsing (same rules as token_dashboard/scanner.py) ───────── */
function newStore() {
  return { msgs: new Map(), results: new Map(), files: 0, lines: 0, skipped: 0 };
}
function slugFromPath(path) {
  const seg = path.split("/").filter(Boolean);
  const pi = seg.indexOf("projects");
  if (pi >= 0 && seg.length > pi + 2) return seg[pi + 1];
  if (seg.length > 2) return seg[1];
  if (seg.length === 2) return seg[0];
  return "(loose files)";
}
function ingest(text, slug, S) {
  let start = 0;
  const n = text.length;
  while (start < n) {
    let nl = text.indexOf("\n", start);
    const end = nl === -1 ? n : nl;
    const line = text.slice(start, end).trim();
    start = end + 1;
    if (!line) continue;
    S.lines++;
    let rec;
    try { rec = JSON.parse(line); } catch (e) { S.skipped++; continue; }
    if (!rec || typeof rec !== "object" || !rec.uuid || !rec.type || !rec.sessionId || !rec.timestamp) { S.skipped++; continue; }
    const m = rec.message || {};
    const content = m.content;
    if (rec.type === "user" && Array.isArray(content)) {
      for (const b of content) {
        if (b && b.type === "tool_result" && b.tool_use_id) {
          let chars = 0;
          if (typeof b.content === "string") chars = b.content.length;
          else if (Array.isArray(b.content)) for (const p of b.content) chars += ((p && p.text) || "").length;
          S.results.set(b.tool_use_id, { tokens: Math.floor(chars / 4), err: !!b.is_error, ts: rec.timestamp, session: rec.sessionId, project: slug });
        }
      }
    }
    let prompt = null;
    if (rec.type === "user") {
      if (typeof content === "string") prompt = content;
      else if (Array.isArray(content)) {
        const t = content.filter(b => b && b.type === "text").map(b => b.text || "").join("");
        prompt = t || null;
      }
    }
    const tools = [];
    if (Array.isArray(content)) {
      for (const b of content) {
        if (!b || b.type !== "tool_use") continue;
        const name = b.name || "unknown";
        const f = TARGET_FIELDS[name];
        const v = f && b.input ? b.input[f] : null;
        tools.push({ id: b.id, name, target: typeof v === "string" ? v.slice(0, 500) : null });
      }
    }
    const us = m.usage || {}, cc = us.cache_creation || {};
    const msg = {
      uuid: rec.uuid, session: rec.sessionId, project: slug, type: rec.type, ts: rec.timestamp,
      sidechain: !!rec.isSidechain, agent: rec.agentId || null, model: m.model || null, mid: m.id || null,
      u: { i: +us.input_tokens || 0, o: +us.output_tokens || 0, cr: +us.cache_read_input_tokens || 0,
           c5: +cc.ephemeral_5m_input_tokens || 0, c1: +cc.ephemeral_1h_input_tokens || 0 },
      prompt, tools
    };
    // Streaming snapshots share (session, message.id) with different uuids: keep only the latest.
    S.msgs.set(msg.mid ? rec.sessionId + "|" + msg.mid : rec.uuid, msg);
  }
}

/* ───────── derive analytics ───────── */
function derive(S) {
  const all = [...S.msgs.values()].sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));
  const D = { all, assistants: [], sessions: new Map(), prompts: [], days: new Map(), projects: new Map(), models: new Map(),
    tools: new Map(), totals: { i: 0, o: 0, cr: 0, cc: 0, cost: 0 }, uncosted: 0, estimated: 0, maxTs: "", minTs: "" };
  const bump = (map, key, init) => { let v = map.get(key); if (!v) { v = init(); map.set(key, v); } return v; };
  const curPrompt = new Map(); // session -> current prompt
  for (const m of all) {
    if (!D.minTs || m.ts < D.minTs) D.minTs = m.ts;
    if (m.ts > D.maxTs) D.maxTs = m.ts;
    const ses = bump(D.sessions, m.session, () => ({ id: m.session, project: m.project, first: m.ts, last: m.ts, turns: 0, prompts: 0, tok: 0, cost: 0, models: new Set() }));
    if (m.ts < ses.first) ses.first = m.ts;
    if (m.ts > ses.last) ses.last = m.ts;
    if (m.type === "user" && m.prompt != null) {
      const p = { n: D.prompts.length, text: m.prompt, ts: m.ts, session: m.session, project: m.project, turns: [], tok: 0, cost: 0, tools: 0, resultTok: 0 };
      D.prompts.push(p); curPrompt.set(m.session, p); ses.prompts++;
    }
    if (m.type !== "assistant") continue;
    const c = costOf(m.model, m.u);
    m.cost = c.usd;
    if (c.usd === null) D.uncosted++; else if (c.estimated) D.estimated++;
    const cc = m.u.c5 + m.u.c1, tok = m.u.i + m.u.o + m.u.cr + cc;
    m.tok = tok; m.cc = cc;
    D.assistants.push(m);
    D.totals.i += m.u.i; D.totals.o += m.u.o; D.totals.cr += m.u.cr; D.totals.cc += cc; D.totals.cost += c.usd || 0;
    ses.turns++; ses.tok += tok; ses.cost += c.usd || 0; if (m.model) ses.models.add(m.model);
    const day = bump(D.days, m.ts.slice(0, 10), () => ({ i: 0, o: 0, cr: 0, cc: 0, cost: 0, turns: 0 }));
    day.i += m.u.i; day.o += m.u.o; day.cr += m.u.cr; day.cc += cc; day.cost += c.usd || 0; day.turns++;
    const pr = bump(D.projects, m.project, () => ({ name: m.project, sessions: new Set(), prompts: 0, tok: 0, cost: 0, cr: 0, rebuild: 0, files: new Map() }));
    pr.sessions.add(m.session); pr.tok += tok; pr.cost += c.usd || 0; pr.cr += m.u.cr; pr.rebuild += m.u.i + cc;
    const md = bump(D.models, m.model || "(unknown)", () => ({ name: m.model || "(unknown)", tok: 0, cost: 0, turns: 0 }));
    md.tok += tok; md.cost += c.usd || 0; md.turns++;
    for (const t of m.tools) {
      D.tools.set(t.name, (D.tools.get(t.name) || 0) + 1);
      if (t.target && (t.name === "Read" || t.name === "Edit" || t.name === "Write")) pr.files.set(t.target, (pr.files.get(t.target) || 0) + 1);
      const r = S.results.get(t.id);
      t.result = r ? r.tokens : null; t.err = r ? r.err : false;
    }
    const p = curPrompt.get(m.session);
    if (p) {
      p.turns.push(m); p.tok += tok; p.cost += c.usd || 0; p.tools += m.tools.length;
      for (const t of m.tools) p.resultTok += t.result || 0;
    }
  }
  for (const p of D.prompts) { const pr = D.projects.get(p.project); if (pr) pr.prompts++; }
  return D;
}

/* ───────── tips (same rules as token_dashboard/tips.py, window anchored to newest data) ───────── */
function computeTips(S, D) {
  if (!D.maxTs) return [];
  const since = new Date(new Date(D.maxTs).getTime() - 7 * DAY).toISOString();
  const win = D.assistants.filter(m => m.ts >= since);
  const out = [];
  const byProj = new Map();
  for (const m of win) {
    const v = byProj.get(m.project) || { cr: 0, rebuild: 0 };
    v.cr += m.u.cr; v.rebuild += m.u.i + m.cc; byProj.set(m.project, v);
  }
  for (const [p, v] of byProj) {
    const total = v.cr + v.rebuild;
    if (total > 100000 && v.cr / total < 0.4)
      out.push({ key: "cache:" + p, category: "cache", title: "Low cache hit rate in " + p,
        body: `Cache hit rate is ${fmtPct(v.cr / total)} over the last 7 days of data. Sessions that restart context frequently rebuild cache. Consider longer-lived sessions or fewer context resets.` });
  }
  const files = new Map(), bash = new Map();
  for (const m of win) for (const t of m.tools) {
    if (!t.target) continue;
    if (t.name === "Read" || t.name === "Edit" || t.name === "Write") {
      const v = files.get(t.target) || { n: 0, s: new Set() }; v.n++; v.s.add(m.session); files.set(t.target, v);
    } else if (t.name === "Bash") bash.set(t.target, (bash.get(t.target) || 0) + 1);
  }
  [...files].filter(([, v]) => v.n > 10).sort((a, b) => b[1].n - a[1].n).slice(0, 10).forEach(([t, v]) =>
    out.push({ key: "repeat-file:" + t, category: "repeat-file", title: `${t} read/edited ${v.n} times`,

  }

  const out = {}; let uid = 0; const U = () => "u" + (++uid);
  const now = Date.now();
  for (const [slug, cfg] of Object.entries(projects)) {
    const lines = [];
    for (let d = 20; d >= 0; d--) {
      const sessions = 1 + Math.floor(rnd() * 2);
      for (let s = 0; s < sessions; s++) {
        const sid = slug.slice(-4) + "-" + d + "-" + s;
        let t = now - d * DAY - Math.floor(rnd() * 8) * 3600000;
        const nP = 3 + Math.floor(rnd() * 5);
        for (let p = 0; p < nP; p++) {
          t += 60000; const ts = k => new Date(t + k * 1000).toISOString();
          lines.push({ type: "user", uuid: U(), sessionId: sid, timestamp: ts(0), message: { role: "user", content: pick(asks) } });
          const turns = 1 + Math.floor(rnd() * 4);
          for (let k = 0; k < turns; k++) {
            const model = pick(cfg.models), mid = "msg_" + U(), big = rnd() < 0.04;
            const toolName = pick(["Read", "Read", "Read", "Edit", "Bash", "Grep"]);
            const input = toolName === "Bash" ? { command: pick(["npm test", "git status", "pytest -q"]) } : toolName === "Grep" ? { pattern: "TODO" } : { file_path: rnd() < 0.5 ? "src/app.js" : pick(files) };
            const tid = "tu_" + U();
            const cacheRead = Math.floor((20000 + rnd() * 90000) * cfg.cacheBias), create = Math.floor((3000 + rnd() * 20000) * (1.05 - cfg.cacheBias));
            const short = model.includes("opus") && rnd() < 0.6;
            const usage = { input_tokens: 200 + Math.floor(rnd() * 3000), output_tokens: short ? 60 + Math.floor(rnd() * 380) : 400 + Math.floor(rnd() * 3500),
              cache_read_input_tokens: cacheRead, cache_creation: { ephemeral_5m_input_tokens: create + (short ? 4000 : 0), ephemeral_1h_input_tokens: 0 } };
            const base = { type: "assistant", sessionId: sid, timestamp: ts(2 + k * 8) };
            // streaming snapshot first (lower output, other uuid) then the final one
            lines.push({ ...base, uuid: U(), message: { id: mid, model, content: [{ type: "text", text: "…" }], usage: { ...usage, output_tokens: Math.floor(usage.output_tokens / 3) } } });
            lines.push({ ...base, uuid: U(), message: { id: mid, model, content: [{ type: "text", text: "ok" }, { type: "tool_use", id: tid, name: toolName, input }], usage } });
            lines.push({ type: "user", uuid: U(), sessionId: sid, timestamp: ts(5 + k * 8), message: { role: "user", content: [{ type: "tool_result", tool_use_id: tid, content: "x".repeat(big ? 240000 : 400 + Math.floor(rnd() * 6000)), is_error: false }] } });
          }
        }
      }
    }
    out[slug] = lines.map(l => JSON.stringify(l)).join("\n");
  }
  return out;
}
function loadSample() {
  stopLive(false);
  S = newStore();
  for (const [slug, text] of Object.entries(sampleText())) { ingest(text, slug, S); S.files++; }
  refreshAll();
  setStatus("Showing SAMPLE data, not yours. " + $("#status").textContent);
}


/* ───────── live folder: Chromium File System Access API ─────────
   The picked folder handle is remembered in IndexedDB. On later visits the browser may ask for one
   click to re-grant access. While connected, only newly appended bytes of each .jsonl are re-read. */
const SUPPORTS_LIVE = typeof window.showDirectoryPicker === "function";
const POLL_CHOICES = [[15000, "15 seconds"], [30000, "30 seconds"], [60000, "60 seconds"], [120000, "2 minutes"], [300000, "5 minutes"], [0, "Off (manual)"]];
const live = { pollMs: 60000, handle: null, pending: null, timer: null, cache: new Map(), scanning: false, last: null, needsPermission: false, remembered: true };
const utf8 = new TextDecoder();
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("token-dashboard", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  } catch (e) { return undefined; }
}
async function idbSet(k, v) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction("kv", "readwrite");
      if (v === undefined) tx.objectStore("kv").delete(k); else tx.objectStore("kv").put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    return true;
  } catch (e) { return false; }
}
function liveSuffix() {
  if (!live.handle || live.needsPermission) return "";
  const every = live.pollMs ? "refreshes every " + (POLL_CHOICES.find(c => c[0] === live.pollMs) || [0, live.pollMs / 1000 + " seconds"])[1] : "auto-refresh off";
  return ` · LIVE "${live.handle.name}", updated ${live.last ? live.last.toTimeString().slice(0, 8) : "…"}, ${every}` +
    (live.remembered ? "" : " · this browser could not remember the folder");
}
function updateLiveButtons() {
  const b = $("#btn-live"), u = $("#btn-unlive");
  if (!SUPPORTS_LIVE) { b.hidden = true; u.hidden = true; return; }
  const connected = !!live.handle && !live.needsPermission;
  b.hidden = connected;
  b.textContent = live.needsPermission && live.pending ? `Reconnect “${live.pending.name}”` : "Connect folder (auto-refresh)";
  u.hidden = !(connected || live.needsPermission);
  $("#live-controls").hidden = !connected;
  $("#btn-folder").classList.toggle("primary", !SUPPORTS_LIVE);
}
async function walkHandle(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === "directory") await walkHandle(h, prefix + name + "/", out);
    else if (/\.jsonl$/i.test(name)) out.push({ handle: h, path: prefix + name });
  }
}
async function scanLive(initial) {
  if (!live.handle || live.scanning) return;
  live.scanning = true;
  const handle = live.handle;
  try {
    const list = [];
    await walkHandle(handle, handle.name + "/", list);
    let changed = 0, seen = 0;
    for (const e of list) {
      if (live.handle !== handle) return; // disconnected or replaced mid-scan
      let file;
      try { file = await e.handle.getFile(); } catch (err) { if (err && err.name === "NotAllowedError") throw err; continue; }
      let c = live.cache.get(e.path);
      if (c && file.size === c.size && file.lastModified === c.mtime) continue;
      if (!c) { c = { consumed: 0, size: -1, mtime: -1 }; live.cache.set(e.path, c); S.files++; }
      if (file.size < c.consumed) c.consumed = 0; // file was rewritten shorter: start over (dedup keeps totals right)
      const buf = new Uint8Array(await file.slice(c.consumed).arrayBuffer());
      const nl = buf.lastIndexOf(10); // only consume complete lines; a half-written tail is retried next scan
      if (nl >= 0) { ingest(utf8.decode(buf.subarray(0, nl + 1)), slugFromPath(e.path), S); c.consumed += nl + 1; changed++; }
      c.size = file.size; c.mtime = file.lastModified;
      if (initial && ++seen % 5 === 0) { setStatus(`Reading ${seen} of ${list.length}: ${e.path}`); await new Promise(r => setTimeout(r)); }
    }
    live.last = new Date();
    if (changed || initial) refreshAll(); else setStatus(statusText());
  } catch (err) {
    if (live.handle !== handle) return;
    clearInterval(live.timer); live.timer = null;
    live.needsPermission = true; live.pending = handle;
    updateLiveButtons(); render();
    setStatus(err && err.name === "NotAllowedError" ? "Folder access expired. Click Reconnect." : "Could not read the folder: " + (err && err.message));
  } finally { live.scanning = false; }
}
async function startLive(handle) {
  stopLive(false);
  S = newStore(); D = derive(S); TIPS = [];
  live.handle = handle; live.pending = handle; live.cache = new Map(); live.needsPermission = false; live.last = null;
  updateLiveButtons();
  await scanLive(true);
  setLiveTimer();
}
function setLiveTimer() {
  clearInterval(live.timer); live.timer = null;
  if (live.handle && !live.needsPermission && live.pollMs > 0) live.timer = setInterval(() => { if (!document.hidden) scanLive(false); }, live.pollMs);
}
function stopLive(forget) {
  clearInterval(live.timer); live.timer = null;
  live.handle = null; live.needsPermission = false;
  if (forget) { live.pending = null; idbSet("dirHandle", undefined); }
  updateLiveButtons();
}
async function connectLive() {
  let handle;
  try { handle = await window.showDirectoryPicker({ id: "claude-projects", mode: "read" }); }
  catch (e) { if (!e || e.name !== "AbortError") setStatus("Could not open the folder: " + (e && e.message)); return; }
  live.remembered = await idbSet("dirHandle", handle);
  await startLive(handle);
}
async function reconnectLive() {
  const h = live.pending; if (!h) return connectLive();
  let perm = "denied";
  try { perm = await h.requestPermission({ mode: "read" }); } catch (e) { /* needs a user gesture; fall through */ }
  if (perm === "granted") await startLive(h); else setStatus("Permission was not granted. Click Reconnect again, or choose the folder again.");
}
async function resumeLive() {
  if (!SUPPORTS_LIVE) return;
  const h = await idbGet("dirHandle");
  if (!h || typeof h.queryPermission !== "function") return;
  live.pending = h;
  let perm = "prompt";
  try { perm = await h.queryPermission({ mode: "read" }); } catch (e) { /* treat as not granted */ }
  if (perm === "granted") await startLive(h);
  else { live.needsPermission = true; updateLiveButtons(); render(); setStatus(`Click “Reconnect” to let this page read “${h.name}” again.`); }
}

/* ───────── events ───────── */
function init() {
  $("#plan").innerHTML = Object.entries(PRICING.plans).map(([k, p]) => `<option value="${k}"${k === state.plan ? " selected" : ""}>${esc(p.label)}</option>`).join("");
  if (!PRICING.plans[state.plan]) state.plan = "api";
  const theme = lsGet("td.theme", "");
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  $("#btn-folder").onclick = () => $("#in-folder").click();
  $("#btn-files").onclick = () => $("#in-files").click();
  $("#btn-sample").onclick = loadSample;
  $("#btn-live").onclick = () => (live.needsPermission && live.pending ? reconnectLive() : connectLive());
  $("#btn-unlive").onclick = () => { stopLive(true); setStatus("Live folder disconnected and forgotten. Data on screen is a snapshot."); };
  document.addEventListener("visibilitychange", () => { if (!document.hidden && live.pollMs) scanLive(false); });
  const saved = +lsGet("td.poll", "60000");
  live.pollMs = POLL_CHOICES.some(c => c[0] === saved) ? saved : 60000;
  $("#poll").innerHTML = POLL_CHOICES.map(([v, l]) => `<option value="${v}"${v === live.pollMs ? " selected" : ""}>${l}</option>`).join("");
  $("#poll").onchange = e => { live.pollMs = +e.target.value; lsSet("td.poll", String(live.pollMs)); setLiveTimer(); setStatus(statusText()); };
  $("#btn-scan").onclick = () => scanLive(false);
  updateLiveButtons();
  $("#in-folder").onchange = e => loadEntries(entriesFromInput(e.target));
  $("#in-files").onchange = e => loadEntries(entriesFromInput(e.target));
  $("#plan").onchange = e => { state.plan = e.target.value; lsSet("td.plan", state.plan); render(); };
  $("#btn-theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next); lsSet("td.theme", next);
  };
  window.addEventListener("hashchange", render);
  window.addEventListener("resize", () => { if (route().name === "overview" && !showTable) drawDaily(); });
  const view = $("#view"), tip = $("#tip-box");
  view.addEventListener("click", e => {
    const a = e.target.closest("[data-act]");
    if (a) { ({ folder: () => $("#in-folder").click(), files: () => $("#in-files").click(), sample: loadSample, live: connectLive, reconnect: reconnectLive })[a.dataset.act](); return; }
    if (e.target.closest("#toggle-table")) { showTable = !showTable; render(); return; }
    const d = e.target.closest("[data-dismiss]");
    if (d) { const m = dismissed(); m[d.dataset.dismiss] = Date.now(); lsSet("td.dismissed", JSON.stringify(m)); render(); return; }
    const row = e.target.closest("tr[data-href]");
    if (row) location.hash = row.dataset.href;
  });
  view.addEventListener("keydown", e => { if (e.key === "Enter") { const row = e.target.closest("tr[data-href]"); if (row) location.hash = row.dataset.href; } });
  view.addEventListener("pointermove", e => {
    const hit = e.target.closest && e.target.closest(".hit");
    if (!hit) { tip.style.display = "none"; return; }
    const v = D.days.get(hit.dataset.day) || { i: 0, o: 0, cr: 0, cc: 0, cost: 0, turns: 0 };
    tip.innerHTML = `<div class="t">${esc(hit.dataset.day)}</div>` +
      SERIES.map(s => `<div class="r"><span><i style="background:var(${s.css})"></i>${s.label}</span><span>${fmtTok(v[s.key])}</span></div>`).join("") +
      `<div class="r" style="margin-top:4px"><span>Est. cost</span><span>${fmtUsd(v.cost)}</span></div>`;
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + "px";
    tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, e.clientY + 14)) + "px";
  });
  view.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  const dropTarget = document.body;
  dropTarget.addEventListener("dragover", e => { e.preventDefault(); const z = $("#dropzone"); if (z) z.classList.add("drag"); });
  dropTarget.addEventListener("dragleave", () => { const z = $("#dropzone"); if (z) z.classList.remove("drag"); });
  dropTarget.addEventListener("drop", async e => {
    e.preventDefault();
    const z = $("#dropzone"); if (z) z.classList.remove("drag");
    const items = [...(e.dataTransfer.items || [])];
    setStatus("Scanning dropped items…");
    await loadEntries(await walkDrop(items));
  });
  render();
}
init();
resumeLive();
if (location.hash === "#demo") { history.replaceState(null, "", "#overview"); loadSample(); }
</script>
